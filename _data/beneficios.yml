- titulo: Ahorro de energía
  texto: "Hasta 50% de ahorro. Mantiene tus ambientes cálidos o fríos con tecnología sustentable."
- titulo: Hermeticidad y estanqueidad
  texto: "Inmejorables cualidades de aislamiento térmico y acústico por sus propiedades físicas."
- titulo: Gran aislación
  texto: "Los perfiles de PVC tienen una transmitancia térmica (frío/calor) muy baja."
- titulo: No transpiran
  texto: "Su perfecto acople y sellado eliminan la condensación."
- titulo: Diseño y decoración
  texto: "Permiten diversas formas y curvar perfiles. Texturas sin pinturas, perfectas al milímetro."
- titulo: Durabilidad
  texto: "Compuestos de PVC libres de plomo y metales pesados, que no se deforman y mantienen sus propiedades."
- titulo: Seguridad
  texto: "El PVC es autoignífugo: en caso de incendio, no propaga la llama."
- titulo: Tecnología sustentable
  texto: "Menor emisión de CO2 en la fabricación. Los recortes de perfil se reutilizan en otros productos."
