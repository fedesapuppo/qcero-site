---
layout: default
---
<header class="encabezado{% if page.imagen %} con-imagen{% endif %}">
  {% if page.imagen %}{% include img.html src=page.imagen alt="" loading="eager" sizes="100vw" class="encabezado-fondo" %}{% endif %}
  <div class="contenedor">
    <h1>{{ page.title }}</h1>
    {% if page.resumen %}<p class="bajada">{{ page.resumen }}</p>{% endif %}
  </div>
</header>
<div class="contenedor texto">
  {{ content }}
</div>
